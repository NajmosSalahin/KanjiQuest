# Render blueprint — owner-directed early hosting (see DECISIONS.md).
# API service only; the React client is deployed to Vercel (per-phase via
# deploy/deploy-client.ps1) and proxies /api/* here to keep cookies same-origin.
services:
  - type: web
    name: kanjiquest-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22.11.0'
      # sync: false — set in the dashboard / via API, never committed:
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: mongo
      # D21: password-reset email via Brevo's HTTPS API. The API key is set in
      # the dashboard (sync: false) and never committed.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        value: najmussalahin.adib@gmail.com
      - key: EMAIL_FROM_NAME
        value: Kanji Garden
      - key: BREVO_API_KEY
        sync: false
