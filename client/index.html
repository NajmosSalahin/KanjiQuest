<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C1432E" />
    <meta
      name="description"
      content="Plant kanji. Watch them grow. A calm spaced-repetition garden for learning Japanese kanji."
    />
    <meta name="application-name" content="Kanji Garden" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanji Garden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Kanji Garden" />
    <meta
      property="og:description"
      content="A calm spaced-repetition garden for learning Japanese kanji."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kanjiquest.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://kanjiquest.vercel.app/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kanji Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Latin faces are self-hosted (src/styles/fonts.css) and preloaded so
         first paint never waits on Google Fonts. Japanese faces load
         asynchronously because their unicode-range sheets are large. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..500&family=Noto+Serif+JP:wght@400..500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..500&family=Noto+Serif+JP:wght@400..500&display=swap"
      />
    </noscript>
    <script>
      // Apply stored theme before first paint (settings ship in Phase 8).
      try {
        var t = localStorage.getItem('kg-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
